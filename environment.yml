name: iceberg

channels:
  - conda-forge

dependencies:
  - python=3.11.16
  - pip
  - numpy=2.4.6
  - pandas=3.0.6
  - scipy=1.17.1
  - scikit-learn=1.9.1
  - lightgbm=4.7.0
  - matplotlib=3.11
  - pillow=12.3.0
  - pyyaml=6.0.3
  - jupyterlab
  - ipykernel
  - pytest
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.14.0+cu126
      - torchvision==0.29.0+cu126
      - kagglehub==1.0.2
